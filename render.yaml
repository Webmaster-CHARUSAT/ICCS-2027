services:
  - type: web
    name: iccs-circle-backend
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Set this to the service's own Render URL (or your custom domain) after the first
      # deploy — see DEPLOY.md step 5. Using the same value for both is fine unless you run a
      # genuinely separate admin origin.
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
